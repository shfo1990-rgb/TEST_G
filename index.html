<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEON STACK: CYBER TOWER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: radial-gradient(circle at center, #15092c 0%, #05020c 100%);
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 480px;
      max-height: 960px;
      background: #090515;
      box-shadow: 0 0 50px rgba(0, 240, 255, 0.2), 0 0 100px rgba(184, 41, 255, 0.15);
      overflow: hidden;
      cursor: pointer;
    }

    #gameCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 상단 HUD */
    #hud {
      position: absolute;
      top: 35px;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }

    .hud-label {
      font-family: 'Orbitron', monospace;
      font-size: 13px;
      letter-spacing: 4px;
      color: #00f0ff;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.7);
    }

    #score {
      font-family: 'Orbitron', monospace;
      font-size: 64px;
      font-weight: 900;
      line-height: 1;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.9), 0 0 40px rgba(184, 41, 255, 0.6);
      transition: transform 0.1s ease;
    }

    #score.pop {
      transform: scale(1.15);
    }

    #combo-box {
      margin-top: 8px;
      padding: 6px 18px;
      border-radius: 20px;
      background: rgba(255, 0, 128, 0.3);
      border: 1px solid #ff0080;
      box-shadow: 0 0 20px rgba(255, 0, 128, 0.6);
      display: flex;
      gap: 8px;
      align-items: center;
      transition: transform 0.15s ease, background 0.3s;
    }

    #combo-box.fever {
      background: rgba(255, 222, 89, 0.35);
      border-color: #ffde59;
      box-shadow: 0 0 25px rgba(255, 222, 89, 0.8);
    }

    #combo-box.pop {
      transform: scale(1.25);
    }

    #combo-text {
      font-family: 'Orbitron', monospace;
      font-size: 14px;
      font-weight: 900;
      color: #ffde59;
      letter-spacing: 2px;
    }

    #combo-box.fever #combo-text {
      color: #fff;
    }

    #combo-count {
      font-family: 'Orbitron', monospace;
      font-size: 15px;
      font-weight: 900;
      color: #fff;
    }

    /* 알림 메시지 (회복 등) */
    #toast-msg {
      position: absolute;
      top: 140px;
      font-family: 'Orbitron', monospace;
      font-size: 16px;
      font-weight: 900;
      color: #00ffaa;
      text-shadow: 0 0 15px #00ffaa;
      letter-spacing: 3px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
    }

    #toast-msg.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* 오버레이 */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(8, 4, 18, 0.88);
      backdrop-filter: blur(8px);
      z-index: 20;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .overlay.hidden {
      display: none !important;
    }

    .glitch-title {
      font-family: 'Orbitron', monospace;
      font-size: 46px;
      font-weight: 900;
      text-align: center;
      line-height: 1.05;
      letter-spacing: 4px;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(0, 240, 255, 0.8);
    }

    .highlight {
      color: #00f0ff;
      text-shadow: 0 0 30px #00f0ff;
    }

    .subtitle {
      font-family: 'Orbitron', monospace;
      font-size: 12px;
      letter-spacing: 6px;
      color: #b829ff;
      margin-top: 10px;
    }

    .tap-guide {
      margin-top: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .pulse-circle {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px solid #00f0ff;
      box-shadow: 0 0 20px #00f0ff;
      animation: pulse 1.6s infinite ease-out;
    }

    @keyframes pulse {
      0% { transform: scale(0.8); opacity: 1; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    .tap-guide span {
      font-size: 16px;
      letter-spacing: 3px;
      color: #00f0ff;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.8);
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .best-score-badge {
      position: absolute;
      bottom: 40px;
      font-family: 'Orbitron', monospace;
      font-size: 14px;
      letter-spacing: 2px;
      color: #8a8aa8;
    }

    /* 게임 오버 화면 */
    .game-over-title {
      font-family: 'Orbitron', monospace;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 4px;
      color: #ff0055;
      text-shadow: 0 0 25px rgba(255, 0, 85, 0.8);
      margin-bottom: 25px;
    }

    .result-box {
      width: 78%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 16px 24px;
      margin-bottom: 25px;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      font-size: 17px;
      color: #ccc;
    }

    .result-val {
      font-family: 'Orbitron', monospace;
      font-size: 24px;
      font-weight: 900;
      color: #fff;
    }

    .glow-btn {
      width: 78%;
      padding: 16px 20px;
      margin-top: 12px;
      border-radius: 30px;
      border: none;
      font-family: 'Orbitron', monospace;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      cursor: pointer;
      background: linear-gradient(135deg, #00f0ff, #7000ff);
      color: #fff;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.5);
      pointer-events: auto;
      transition: transform 0.1s;
    }

    .glow-btn:active {
      transform: scale(0.96);
    }

    .glow-btn.reward {
      background: linear-gradient(135deg, #ff0080, #ffde59);
      box-shadow: 0 0 30px rgba(255, 0, 128, 0.6);
      animation: rewardGlow 2s infinite ease-in-out;
    }

    @keyframes rewardGlow {
      0%, 100% { box-shadow: 0 0 25px rgba(255, 0, 128, 0.6); }
      50% { box-shadow: 0 0 45px rgba(255, 222, 89, 0.9); }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- 상단 HUD -->
    <div id="hud">
      <div id="score-box">
        <span class="hud-label">SCORE</span>
        <span id="score">0</span>
      </div>
      <div id="combo-box" style="display: none;">
        <span id="combo-text">PERFECT!</span>
        <span id="combo-count">x1</span>
      </div>
      <div id="toast-msg">SIZE EXPANDED!</div>
    </div>

    <!-- 시작 화면 -->
    <div id="start-screen" class="overlay">
      <h1 class="glitch-title">NEON<br><span class="highlight">STACK</span></h1>
      <p class="subtitle">CYBER TOWER 2077</p>
      <div class="tap-guide">
        <div class="pulse-circle"></div>
        <span>화면을 탭하여 시작</span>
      </div>
      <div class="best-score-badge">BEST: <span id="start-best-score">0</span></div>
    </div>

    <!-- 게임 오버 -->
    <div id="game-over-screen" class="overlay hidden">
      <h2 class="game-over-title">SYSTEM COLLAPSE</h2>
      <div class="result-box">
        <div class="result-row">
          <span>최종 점수</span>
          <span id="final-score" class="result-val">0</span>
        </div>
        <div class="result-row">
          <span>최고 점수</span>
          <span id="final-best" class="result-val highlight">0</span>
        </div>
      </div>
      <button id="reward-ad-btn" class="glow-btn reward">
        ⚡ 보상 광고 보고 부활 (최대 크기 복구)
      </button>
      <button id="restart-btn" class="glow-btn">
        다시 시작
      </button>
    </div>
  </div>

  <script>
    (function() {
      // 1. 게임 상태
      const STATE = { READY: 0, PLAYING: 1, GAMEOVER: 2 };
      let state = STATE.READY;

      // 2. DOM 요소
      const container = document.getElementById('game-container');
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const comboBox = document.getElementById('combo-box');
      const comboTextEl = document.getElementById('combo-text');
      const comboCountEl = document.getElementById('combo-count');
      const toastEl = document.getElementById('toast-msg');
      const startScreen = document.getElementById('start-screen');
      const gameOverScreen = document.getElementById('game-over-screen');
      const startBestScoreEl = document.getElementById('start-best-score');
      const finalScoreEl = document.getElementById('final-score');
      const finalBestEl = document.getElementById('final-best');
      const restartBtn = document.getElementById('restart-btn');
      const rewardAdBtn = document.getElementById('reward-ad-btn');

      // 3. 게임 상수
      const BLOCK_HEIGHT = 28;
      const INITIAL_SIZE = 220;
      const PERFECT_TOLERANCE = 6;
      const RECOVER_COMBO = 4; // 4회 연속 퍼펙트 시 크기 회복

      let score = 0;
      let bestScore = 0;
      try { bestScore = parseInt(localStorage.getItem('neon_best') || '0', 10); } catch(e) {}
      startBestScoreEl.innerText = bestScore;

      let combo = 0;
      let colorHue = 190;
      let stack = [];
      let fallingPieces = [];
      let particles = [];
      let currentBlock = null;
      let cameraY = 0;
      let targetCameraY = 0;
      let viewWidth = 360;
      let viewHeight = 640;

      // 화면 흔들림(Camera Shake) 변수
      let shakeIntensity = 0;
      let shakeOffsetX = 0;
      let shakeOffsetY = 0;

      // 4. 신디사이저 사운드 엔진
      let audioCtx = null;
      const noteFreqs = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];

      function playSound(type, comboCount = 0) {
        try {
          if (!audioCtx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (AC) audioCtx = new AC();
          }
          if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
          if (!audioCtx) return;

          const now = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          if (type === 'hit') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(320, now);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.15);
          } else if (type === 'perfect') {
            osc.type = 'triangle';
            const noteIdx = Math.min(comboCount, noteFreqs.length - 1);
            const freq = noteFreqs[noteIdx];
            osc.frequency.setValueAtTime(freq, now);
            osc.frequency.exponentialRampToValueAtTime(freq * 1.5, now + 0.2);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.35);
          } else if (type === 'recover') {
            // 크기 확장 보너스 화음
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.4);
            gain.gain.setValueAtTime(0.35, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.45);
          } else if (type === 'gameover') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.exponentialRampToValueAtTime(45, now + 0.5);
            gain.gain.setValueAtTime(0.35, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.5);
          }
        } catch(e) {}
      }

      // 모바일 진동(햅틱) 지원
      function triggerHaptic(duration = 20) {
        if ('vibrate' in navigator) {
          try { navigator.vibrate(duration); } catch(e) {}
        }
      }

      // 5. 캔버스 리사이즈
      function resize() {
        const rect = container.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        viewWidth = rect.width || 360;
        viewHeight = rect.height || 640;
        canvas.width = viewWidth * dpr;
        canvas.height = viewHeight * dpr;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(dpr, dpr);
      }
      window.addEventListener('resize', resize);
      resize();

      // 6. 등각 투영 3D 변환 (카메라 쉐이크 오프셋 적용)
      function project(x, y, z) {
        const originX = viewWidth / 2 + shakeOffsetX;
        const originY = viewHeight * 0.68 + cameraY + shakeOffsetY;
        const isoX = originX + (x - z) * 0.866;
        const isoY = originY + (x + z) * 0.5 - y;
        return { x: isoX, y: isoY };
      }

      // 7. 파티클 생성기 (네온 스파크)
      function createParticles(x, y, z, width, depth, hue, count = 35) {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 2.5 + Math.random() * 5.5;
          particles.push({
            x: x + (Math.random() - 0.5) * width,
            y: y + BLOCK_HEIGHT,
            z: z + (Math.random() - 0.5) * depth,
            vx: Math.cos(angle) * speed,
            vy: 3.0 + Math.random() * 5.0, // 위로 솟구침
            vz: Math.sin(angle) * speed,
            size: 2.5 + Math.random() * 3.5,
            hue: hue,
            alpha: 1.0,
            life: 0.95
          });
        }
      }

      // 8. 3D 블록 렌더링
      function drawBlock(x, y, z, width, depth, height, hue, alpha = 1.0, isGlow = false) {
        const hw = width / 2;
        const hd = depth / 2;

        const p0 = project(x - hw, y + height, z - hd);
        const p1 = project(x + hw, y + height, z - hd);
        const p2 = project(x + hw, y + height, z + hd);
        const p3 = project(x - hw, y + height, z + hd);

        const b1 = project(x + hw, y, z - hd);
        const b2 = project(x + hw, y, z + hd);
        const b3 = project(x - hw, y, z + hd);

        // 앞 왼쪽 면
        ctx.fillStyle = 'hsla(' + hue + ', 85%, 35%, ' + alpha + ')';
        ctx.beginPath();
        ctx.moveTo(p3.x, p3.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.lineTo(b2.x, b2.y);
        ctx.lineTo(b3.x, b3.y);
        ctx.closePath();
        ctx.fill();

        // 앞 오른쪽 면
        ctx.fillStyle = 'hsla(' + hue + ', 85%, 22%, ' + alpha + ')';
        ctx.beginPath();
        ctx.moveTo(p2.x, p2.y);
        ctx.lineTo(p1.x, p1.y);
        ctx.lineTo(b1.x, b1.y);
        ctx.lineTo(b2.x, b2.y);
        ctx.closePath();
        ctx.fill();

        // 윗면 (네온 탑)
        ctx.fillStyle = 'hsla(' + hue + ', 95%, ' + (isGlow ? '72%' : '58%') + ', ' + alpha + ')';
        ctx.beginPath();
        ctx.moveTo(p0.x, p0.y);
        ctx.lineTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.lineTo(p3.x, p3.y);
        ctx.closePath();
        ctx.fill();

        // 외곽선 하이라이트
        ctx.strokeStyle = 'hsla(' + hue + ', 100%, 85%, ' + alpha + ')';
        ctx.lineWidth = isGlow ? 2.5 : 1.5;
        ctx.stroke();
      }

      // 9. 다음 블록 스폰
      function spawnBlock() {
        const top = stack[stack.length - 1];
        const isEven = stack.length % 2 === 0;
        colorHue = (colorHue + 11) % 360;

        const axis = isEven ? 'z' : 'x';
        const speed = 3.8 + Math.min(score * 0.08, 6.8);

        currentBlock = {
          x: top.x,
          z: top.z,
          width: top.width,
          depth: top.depth,
          y: stack.length * BLOCK_HEIGHT,
          axis: axis,
          dir: 1,
          speed: speed,
          hue: colorHue
        };

        if (axis === 'x') currentBlock.x = -260;
        else currentBlock.z = -260;

        if (stack.length > 5) {
          targetCameraY = (stack.length - 5) * BLOCK_HEIGHT;
        }
      }

      // 10. 게임 리셋
      function resetGame() {
        score = 0;
        combo = 0;
        colorHue = Math.floor(Math.random() * 360);
        stack = [];
        fallingPieces = [];
        particles = [];
        cameraY = 0;
        targetCameraY = 0;
        shakeIntensity = 0;
        scoreEl.innerText = '0';
        comboBox.style.display = 'none';

        stack.push({
          x: 0,
          z: 0,
          width: INITIAL_SIZE,
          depth: INITIAL_SIZE,
          y: 0,
          hue: colorHue
        });

        spawnBlock();
      }

      // 11. 게임 오버
      function triggerGameOver() {
        state = STATE.GAMEOVER;
        playSound('gameover');
        triggerHaptic(80);
        shakeIntensity = 18; // 강한 충격 흔들림

        if (score > bestScore) {
          bestScore = score;
          try { localStorage.setItem('neon_best', bestScore.toString()); } catch(e) {}
        }
        finalScoreEl.innerText = score;
        finalBestEl.innerText = bestScore;

        setTimeout(function() {
          gameOverScreen.classList.remove('hidden');
        }, 500);
      }

      // 알림 토스트 표시
      function showToast(msg) {
        toastEl.innerText = msg;
        toastEl.classList.add('show');
        setTimeout(function() { toastEl.classList.remove('show'); }, 1200);
      }

      // 12. 탭 액션 처리
      function handleAction() {
        if (state === STATE.READY) {
          state = STATE.PLAYING;
          startScreen.classList.add('hidden');
          playSound('hit');
          triggerHaptic(20);
          return;
        }

        if (state === STATE.PLAYING && currentBlock) {
          const prev = stack[stack.length - 1];
          const cur = currentBlock;
          const axis = cur.axis;
          const delta = cur[axis] - prev[axis];
          const absDelta = Math.abs(delta);
          const sizeProp = axis === 'x' ? 'width' : 'depth';
          const origSize = prev[sizeProp];

          // 1) 퍼펙트 스냅
          if (absDelta <= PERFECT_TOLERANCE) {
            cur[axis] = prev[axis];
            combo++;
            shakeIntensity = 5; // 기분 좋은 미세 진동
            triggerHaptic(30);

            // 연속 퍼펙트 달성 시 블록 크기 회복 보너스!
            let recovered = false;
            if (combo % RECOVER_COMBO === 0 && cur[sizeProp] < INITIAL_SIZE) {
              const expand = Math.min(25, INITIAL_SIZE - cur[sizeProp]);
              cur[sizeProp] += expand;
              recovered = true;
              showToast('SIZE RECOVERED! +' + expand + 'px');
              playSound('recover');
            } else {
              playSound('perfect', combo);
            }

            // 파티클 폭발
            createParticles(cur.x, cur.y, cur.z, cur.width, cur.depth, cur.hue, 40);

            // HUD 갱신
            comboCountEl.innerText = 'x' + combo;
            if (combo >= 3) {
              comboTextEl.innerText = 'FEVER!';
              comboBox.classList.add('fever');
            } else {
              comboTextEl.innerText = 'PERFECT!';
              comboBox.classList.remove('fever');
            }
            comboBox.style.display = 'flex';
            comboBox.classList.remove('pop');
            void comboBox.offsetWidth;
            comboBox.classList.add('pop');

            // 점수 증가 (피버 보너스)
            const addScore = (combo >= 3) ? 2 : 1;
            score += addScore;
            scoreEl.innerText = score;
            scoreEl.classList.add('pop');
            setTimeout(function() { scoreEl.classList.remove('pop'); }, 150);

            stack.push(cur);
            spawnBlock();
            return;
          }

          // 2) 완전 탈락
          if (absDelta >= origSize) {
            fallingPieces.push({
              x: cur.x, z: cur.z, y: cur.y,
              width: cur.width, depth: cur.depth,
              hue: cur.hue, vy: 0
            });
            currentBlock = null;
            triggerGameOver();
            return;
          }

          // 3) 슬라이스 자르기
          combo = 0;
          comboBox.style.display = 'none';
          comboBox.classList.remove('fever');
          playSound('hit');
          triggerHaptic(20);
          shakeIntensity = 7;

          const newSize = origSize - absDelta;
          const fallSize = absDelta;

          cur[sizeProp] = newSize;
          if (delta > 0) cur[axis] = prev[axis] + absDelta / 2;
          else cur[axis] = prev[axis] - absDelta / 2;

          stack.push(cur);
          score++;
          scoreEl.innerText = score;

          const fp = {
            x: cur.x, z: cur.z, y: cur.y,
            width: cur.width, depth: cur.depth,
            hue: cur.hue, vy: 0
          };
          fp[sizeProp] = fallSize;
          if (delta > 0) fp[axis] = cur[axis] + newSize / 2 + fallSize / 2;
          else fp[axis] = cur[axis] - newSize / 2 - fallSize / 2;

          fallingPieces.push(fp);
          spawnBlock();
        }
      }

      // 13. 입력 이벤트 바인딩
      window.addEventListener('mousedown', function(e) {
        if (e.target && (e.target.tagName === 'BUTTON' || e.target.closest('button'))) return;
        handleAction();
      });

      window.addEventListener('touchstart', function(e) {
        if (e.target && (e.target.tagName === 'BUTTON' || e.target.closest('button'))) return;
        e.preventDefault();
        handleAction();
      }, { passive: false });

      restartBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        resetGame();
        state = STATE.PLAYING;
        gameOverScreen.classList.add('hidden');
      });

      rewardAdBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        rewardAdBtn.innerText = '광고 시청 중... (3초)';
        rewardAdBtn.disabled = true;
        setTimeout(function() {
          rewardAdBtn.innerText = '⚡ 보상 광고 보고 부활 (최대 크기 복구)';
          rewardAdBtn.disabled = false;
          gameOverScreen.classList.add('hidden');

          const top = stack[stack.length - 1];
          top.width = INITIAL_SIZE;
          top.depth = INITIAL_SIZE;
          top.x = 0;
          top.z = 0;
          state = STATE.PLAYING;
          spawnBlock();
        }, 3000);
      });

      // 14. 메인 업데이트 루프
      function update() {
        // 블록 이동
        if (state === STATE.PLAYING && currentBlock) {
          const b = currentBlock;
          b[b.axis] += b.speed * b.dir;
          const LIMIT = 270;
          if (b[b.axis] > LIMIT) { b[b.axis] = LIMIT; b.dir = -1; }
          else if (b[b.axis] < -LIMIT) { b[b.axis] = -LIMIT; b.dir = 1; }
        }

        // 파편 추락
        for (let i = fallingPieces.length - 1; i >= 0; i--) {
          const p = fallingPieces[i];
          p.vy += 0.85;
          p.y -= p.vy;
          if (p.y < cameraY - 450) {
            fallingPieces.splice(i, 1);
          }
        }

        // 파티클 물리
        for (let i = particles.length - 1; i >= 0; i--) {
          const pt = particles[i];
          pt.x += pt.vx;
          pt.y += pt.vy;
          pt.z += pt.vz;
          pt.vy -= 0.35; // 중력
          pt.alpha *= pt.life;
          if (pt.alpha < 0.05) {
            particles.splice(i, 1);
          }
        }

        // 카메라 이동 Lerp
        cameraY += (targetCameraY - cameraY) * 0.1;

        // 카메라 쉐이크 감쇠
        if (shakeIntensity > 0) {
          shakeOffsetX = (Math.random() - 0.5) * shakeIntensity;
          shakeOffsetY = (Math.random() - 0.5) * shakeIntensity;
          shakeIntensity *= 0.85;
          if (shakeIntensity < 0.3) {
            shakeIntensity = 0;
            shakeOffsetX = 0;
            shakeOffsetY = 0;
          }
        }
      }

      // 15. 렌더 루프
      function render() {
        ctx.clearRect(0, 0, viewWidth, viewHeight);

        // 1) 고정 스택 렌더링
        for (let i = 0; i < stack.length; i++) {
          const b = stack[i];
          const isTop = (i === stack.length - 1);
          drawBlock(b.x, b.y, b.z, b.width, b.depth, BLOCK_HEIGHT, b.hue, 1.0, isTop && combo >= 3);
        }

        // 2) 추락 파편 렌더링
        for (let i = 0; i < fallingPieces.length; i++) {
          const p = fallingPieces[i];
          drawBlock(p.x, p.y, p.z, p.width, p.depth, BLOCK_HEIGHT, p.hue, 0.85);
        }

        // 3) 파티클 렌더링
        for (let i = 0; i < particles.length; i++) {
          const pt = particles[i];
          const scr = project(pt.x, pt.y, pt.z);
          ctx.fillStyle = 'hsla(' + pt.hue + ', 100%, 75%, ' + pt.alpha + ')';
          ctx.beginPath();
          ctx.arc(scr.x, scr.y, pt.size, 0, Math.PI * 2);
          ctx.fill();
        }

        // 4) 현재 이동 블록 렌더링
        if (currentBlock) {
          const c = currentBlock;
          drawBlock(c.x, c.y, c.z, c.width, c.depth, BLOCK_HEIGHT, c.hue, 1.0, combo >= 3);
        }
      }

      function loop() {
        update();
        render();
        requestAnimationFrame(loop);
      }

      resetGame();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
