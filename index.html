<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEON STACK: CYBER TOWER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: radial-gradient(circle at center, #140a2b 0%, #05020c 100%);
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 480px;
      max-height: 960px;
      background: #090515;
      box-shadow: 0 0 50px rgba(0, 240, 255, 0.2), 0 0 100px rgba(184, 41, 255, 0.15);
      overflow: hidden;
      cursor: pointer;
    }

    #gameCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 상단 HUD */
    #hud {
      position: absolute;
      top: 35px;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }

    .hud-label {
      font-family: 'Orbitron', monospace;
      font-size: 13px;
      letter-spacing: 4px;
      color: #00f0ff;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.7);
    }

    #score {
      font-family: 'Orbitron', monospace;
      font-size: 60px;
      font-weight: 900;
      line-height: 1;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.9), 0 0 40px rgba(184, 41, 255, 0.6);
    }

    #combo-box {
      margin-top: 8px;
      padding: 6px 18px;
      border-radius: 20px;
      background: rgba(255, 0, 128, 0.25);
      border: 1px solid #ff0080;
      box-shadow: 0 0 15px rgba(255, 0, 128, 0.5);
      display: flex;
      gap: 8px;
      align-items: center;
      transition: transform 0.15s ease;
    }

    #combo-box.pop {
      transform: scale(1.25);
    }

    #combo-text {
      font-family: 'Orbitron', monospace;
      font-size: 13px;
      font-weight: 900;
      color: #ffde59;
      letter-spacing: 2px;
    }

    #combo-count {
      font-family: 'Orbitron', monospace;
      font-size: 14px;
      font-weight: 900;
      color: #fff;
    }

    /* 오버레이 */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(8, 4, 18, 0.88);
      backdrop-filter: blur(8px);
      z-index: 20;
      pointer-events: none; /* 클릭 통과 */
      transition: opacity 0.2s ease;
    }

    .overlay.hidden {
      display: none !important;
    }

    .glitch-title {
      font-family: 'Orbitron', monospace;
      font-size: 46px;
      font-weight: 900;
      text-align: center;
      line-height: 1.05;
      letter-spacing: 4px;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(0, 240, 255, 0.8);
    }

    .highlight {
      color: #00f0ff;
      text-shadow: 0 0 30px #00f0ff;
    }

    .subtitle {
      font-family: 'Orbitron', monospace;
      font-size: 12px;
      letter-spacing: 6px;
      color: #b829ff;
      margin-top: 10px;
    }

    .tap-guide {
      margin-top: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .pulse-circle {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px solid #00f0ff;
      box-shadow: 0 0 20px #00f0ff;
      animation: pulse 1.6s infinite ease-out;
    }

    @keyframes pulse {
      0% { transform: scale(0.8); opacity: 1; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    .tap-guide span {
      font-size: 16px;
      letter-spacing: 3px;
      color: #00f0ff;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.8);
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .best-score-badge {
      position: absolute;
      bottom: 40px;
      font-family: 'Orbitron', monospace;
      font-size: 14px;
      letter-spacing: 2px;
      color: #8a8aa8;
    }

    /* 게임 오버 */
    .game-over-title {
      font-family: 'Orbitron', monospace;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 4px;
      color: #ff0055;
      text-shadow: 0 0 25px rgba(255, 0, 85, 0.8);
      margin-bottom: 25px;
    }

    .result-box {
      width: 78%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 16px 24px;
      margin-bottom: 25px;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      font-size: 17px;
      color: #ccc;
    }

    .result-val {
      font-family: 'Orbitron', monospace;
      font-size: 24px;
      font-weight: 900;
      color: #fff;
    }

    .glow-btn {
      width: 78%;
      padding: 16px 20px;
      margin-top: 12px;
      border-radius: 30px;
      border: none;
      font-family: 'Orbitron', monospace;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      cursor: pointer;
      background: linear-gradient(135deg, #00f0ff, #7000ff);
      color: #fff;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.5);
      pointer-events: auto; /* 버튼만 클릭 가능 */
    }

    .glow-btn.reward {
      background: linear-gradient(135deg, #ff0080, #ffde59);
      box-shadow: 0 0 30px rgba(255, 0, 128, 0.6);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- 상단 HUD -->
    <div id="hud">
      <div id="score-box">
        <span class="hud-label">SCORE</span>
        <span id="score">0</span>
      </div>
      <div id="combo-box" style="display: none;">
        <span id="combo-text">PERFECT!</span>
        <span id="combo-count">x1</span>
      </div>
    </div>

    <!-- 시작 화면 오버레이 -->
    <div id="start-screen" class="overlay">
      <h1 class="glitch-title">NEON<br><span class="highlight">STACK</span></h1>
      <p class="subtitle">CYBER TOWER 2077</p>
      <div class="tap-guide">
        <div class="pulse-circle"></div>
        <span>화면을 탭하여 시작</span>
      </div>
      <div class="best-score-badge">BEST: <span id="start-best-score">0</span></div>
    </div>

    <!-- 게임 오버 오버레이 -->
    <div id="game-over-screen" class="overlay hidden">
      <h2 class="game-over-title">SYSTEM COLLAPSE</h2>
      <div class="result-box">
        <div class="result-row">
          <span>최종 점수</span>
          <span id="final-score" class="result-val">0</span>
        </div>
        <div class="result-row">
          <span>최고 점수</span>
          <span id="final-best" class="result-val highlight">0</span>
        </div>
      </div>
      <button id="reward-ad-btn" class="glow-btn reward">
        ⚡ 보상 광고 보고 부활
      </button>
      <button id="restart-btn" class="glow-btn">
        다시 시작
      </button>
    </div>
  </div>

  <script>
    (function() {
      // 1. 상태 상수
      const STATE = { READY: 0, PLAYING: 1, GAMEOVER: 2 };
      let state = STATE.READY;

      // 2. DOM 요소 참조
      const container = document.getElementById('game-container');
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const comboBox = document.getElementById('combo-box');
      const comboCountEl = document.getElementById('combo-count');
      const startScreen = document.getElementById('start-screen');
      const gameOverScreen = document.getElementById('game-over-screen');
      const startBestScoreEl = document.getElementById('start-best-score');
      const finalScoreEl = document.getElementById('final-score');
      const finalBestEl = document.getElementById('final-best');
      const restartBtn = document.getElementById('restart-btn');
      const rewardAdBtn = document.getElementById('reward-ad-btn');

      // 3. 게임 변수
      const BLOCK_HEIGHT = 28;
      const INITIAL_SIZE = 220;
      const PERFECT_TOLERANCE = 6;

      let score = 0;
      let bestScore = 0;
      try { bestScore = parseInt(localStorage.getItem('neon_best') || '0', 10); } catch(e) {}
      startBestScoreEl.innerText = bestScore;

      let combo = 0;
      let colorHue = 185;
      let stack = [];
      let fallingPieces = [];
      let currentBlock = null;
      let cameraY = 0;
      let targetCameraY = 0;
      let viewWidth = 360;
      let viewHeight = 640;

      // 4. 사운드 합성기
      let audioCtx = null;
      const noteFreqs = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25, 587.33, 659.25, 783.99, 880.00];

      function playSound(isHit, comboCount = 0, isPerfect = false) {
        try {
          if (!audioCtx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (AC) audioCtx = new AC();
          }
          if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
          if (!audioCtx) return;

          const now = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          if (isHit) {
            osc.type = isPerfect ? 'triangle' : 'sine';
            const noteIdx = Math.min(comboCount, noteFreqs.length - 1);
            const freq = noteFreqs[noteIdx];
            osc.frequency.setValueAtTime(freq, now);
            if (isPerfect) osc.frequency.exponentialRampToValueAtTime(freq * 1.5, now + 0.15);
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + (isPerfect ? 0.35 : 0.2));
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + (isPerfect ? 0.35 : 0.2));
          } else {
            // 게임 오버
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.exponentialRampToValueAtTime(50, now + 0.4);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.4);
          }
        } catch(e) {}
      }

      // 5. 캔버스 리사이즈
      function resize() {
        const rect = container.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        viewWidth = rect.width || 360;
        viewHeight = rect.height || 640;
        canvas.width = viewWidth * dpr;
        canvas.height = viewHeight * dpr;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(dpr, dpr);
      }
      window.addEventListener('resize', resize);
      resize();

      // 6. 등각 투영 좌표 변환 (3D -> 2D)
      function project(x, y, z) {
        const originX = viewWidth / 2;
        const originY = viewHeight * 0.68 + cameraY;
        const isoX = originX + (x - z) * 0.866;
        const isoY = originY + (x + z) * 0.5 - y;
        return { x: isoX, y: isoY };
      }

      // 7. 3D 블록 그리기
      function drawBlock(x, y, z, width, depth, height, hue, alpha = 1.0) {
        const hw = width / 2;
        const hd = depth / 2;

        const p0 = project(x - hw, y + height, z - hd);
        const p1 = project(x + hw, y + height, z - hd);
        const p2 = project(x + hw, y + height, z + hd);
        const p3 = project(x - hw, y + height, z + hd);

        const b1 = project(x + hw, y, z - hd);
        const b2 = project(x + hw, y, z + hd);
        const b3 = project(x - hw, y, z + hd);

        // 앞 왼쪽 면
        ctx.fillStyle = 'hsla(' + hue + ', 85%, 35%, ' + alpha + ')';
        ctx.beginPath();
        ctx.moveTo(p3.x, p3.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.lineTo(b2.x, b2.y);
        ctx.lineTo(b3.x, b3.y);
        ctx.closePath();
        ctx.fill();

        // 앞 오른쪽 면
        ctx.fillStyle = 'hsla(' + hue + ', 85%, 22%, ' + alpha + ')';
        ctx.beginPath();
        ctx.moveTo(p2.x, p2.y);
        ctx.lineTo(p1.x, p1.y);
        ctx.lineTo(b1.x, b1.y);
        ctx.lineTo(b2.x, b2.y);
        ctx.closePath();
        ctx.fill();

        // 윗면 (네온 하이라이트)
        ctx.fillStyle = 'hsla(' + hue + ', 95%, 58%, ' + alpha + ')';
        ctx.beginPath();
        ctx.moveTo(p0.x, p0.y);
        ctx.lineTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.lineTo(p3.x, p3.y);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = 'hsla(' + hue + ', 100%, 82%, ' + alpha + ')';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      // 8. 새 블록 스폰
      function spawnBlock() {
        const top = stack[stack.length - 1];
        const isEven = stack.length % 2 === 0;
        colorHue = (colorHue + 10) % 360;

        const axis = isEven ? 'z' : 'x';
        const speed = 3.6 + Math.min(score * 0.08, 6.5);

        currentBlock = {
          x: top.x,
          z: top.z,
          width: top.width,
          depth: top.depth,
          y: stack.length * BLOCK_HEIGHT,
          axis: axis,
          dir: 1,
          speed: speed,
          hue: colorHue
        };

        if (axis === 'x') currentBlock.x = -260;
        else currentBlock.z = -260;

        if (stack.length > 5) {
          targetCameraY = (stack.length - 5) * BLOCK_HEIGHT;
        }
      }

      // 9. 게임 리셋
      function resetGame() {
        score = 0;
        combo = 0;
        colorHue = Math.floor(Math.random() * 360);
        stack = [];
        fallingPieces = [];
        cameraY = 0;
        targetCameraY = 0;
        scoreEl.innerText = '0';
        comboBox.style.display = 'none';

        // 바닥 블록
        stack.push({
          x: 0,
          z: 0,
          width: INITIAL_SIZE,
          depth: INITIAL_SIZE,
          y: 0,
          hue: colorHue
        });

        spawnBlock();
      }

      // 10. 게임 오버
      function triggerGameOver() {
        state = STATE.GAMEOVER;
        playSound(false);

        if (score > bestScore) {
          bestScore = score;
          try { localStorage.setItem('neon_best', bestScore.toString()); } catch(e) {}
        }
        finalScoreEl.innerText = score;
        finalBestEl.innerText = bestScore;

        setTimeout(function() {
          gameOverScreen.classList.remove('hidden');
        }, 500);
      }

      // 11. 클릭 / 탭 핸들러
      function handleAction() {
        // [READY 상태] -> 게임 시작
        if (state === STATE.READY) {
          state = STATE.PLAYING;
          startScreen.classList.add('hidden');
          playSound(true, 0, false);
          return;
        }

        // [PLAYING 상태] -> 블록 배치
        if (state === STATE.PLAYING && currentBlock) {
          const prev = stack[stack.length - 1];
          const cur = currentBlock;
          const axis = cur.axis;
          const delta = cur[axis] - prev[axis];
          const absDelta = Math.abs(delta);
          const sizeProp = axis === 'x' ? 'width' : 'depth';
          const origSize = prev[sizeProp];

          // 1) 퍼펙트 스냅
          if (absDelta <= PERFECT_TOLERANCE) {
            cur[axis] = prev[axis];
            combo++;
            playSound(true, combo, true);

            comboCountEl.innerText = 'x' + combo;
            comboBox.style.display = 'flex';
            comboBox.classList.remove('pop');
            void comboBox.offsetWidth;
            comboBox.classList.add('pop');

            stack.push(cur);
            score++;
            scoreEl.innerText = score;
            spawnBlock();
            return;
          }

          // 2) 완전 빗나감 (게임오버)
          if (absDelta >= origSize) {
            fallingPieces.push({
              x: cur.x, z: cur.z, y: cur.y,
              width: cur.width, depth: cur.depth,
              hue: cur.hue, vy: 0
            });
            currentBlock = null;
            triggerGameOver();
            return;
          }

          // 3) 슬라이스 자르기
          combo = 0;
          comboBox.style.display = 'none';
          playSound(true, 0, false);

          const newSize = origSize - absDelta;
          const fallSize = absDelta;

          cur[sizeProp] = newSize;
          if (delta > 0) cur[axis] = prev[axis] + absDelta / 2;
          else cur[axis] = prev[axis] - absDelta / 2;

          stack.push(cur);
          score++;
          scoreEl.innerText = score;

          // 파편 생성
          const fp = {
            x: cur.x, z: cur.z, y: cur.y,
            width: cur.width, depth: cur.depth,
            hue: cur.hue, vy: 0
          };
          fp[sizeProp] = fallSize;
          if (delta > 0) fp[axis] = cur[axis] + newSize / 2 + fallSize / 2;
          else fp[axis] = cur[axis] - newSize / 2 - fallSize / 2;

          fallingPieces.push(fp);
          spawnBlock();
        }
      }

      // 12. 전체 화면 클릭 이벤트 연결 (확실한 단일 이벤트 리스너)
      window.addEventListener('mousedown', function(e) {
        if (e.target && (e.target.tagName === 'BUTTON' || e.target.closest('button'))) return;
        handleAction();
      });

      window.addEventListener('touchstart', function(e) {
        if (e.target && (e.target.tagName === 'BUTTON' || e.target.closest('button'))) return;
        e.preventDefault();
        handleAction();
      }, { passive: false });

      // 다시 시작 버튼
      restartBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        resetGame();
        state = STATE.PLAYING;
        gameOverScreen.classList.add('hidden');
      });

      // 보상 광고 버튼
      rewardAdBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        rewardAdBtn.innerText = '광고 시청 중... (3초)';
        rewardAdBtn.disabled = true;
        setTimeout(function() {
          rewardAdBtn.innerText = '⚡ 보상 광고 보고 부활';
          rewardAdBtn.disabled = false;
          gameOverScreen.classList.add('hidden');

          const top = stack[stack.length - 1];
          top.width = INITIAL_SIZE;
          top.depth = INITIAL_SIZE;
          top.x = 0;
          top.z = 0;
          state = STATE.PLAYING;
          spawnBlock();
        }, 3000);
      });

      // 13. 메인 업데이트 & 렌더 루프
      function update() {
        if (state === STATE.PLAYING && currentBlock) {
          const b = currentBlock;
          b[b.axis] += b.speed * b.dir;
          const LIMIT = 270;
          if (b[b.axis] > LIMIT) { b[b.axis] = LIMIT; b.dir = -1; }
          else if (b[b.axis] < -LIMIT) { b[b.axis] = -LIMIT; b.dir = 1; }
        }

        for (let i = fallingPieces.length - 1; i >= 0; i--) {
          const p = fallingPieces[i];
          p.vy += 0.85;
          p.y -= p.vy;
          if (p.y < cameraY - 450) {
            fallingPieces.splice(i, 1);
          }
        }

        cameraY += (targetCameraY - cameraY) * 0.1;
      }

      function render() {
        ctx.clearRect(0, 0, viewWidth, viewHeight);

        for (let i = 0; i < stack.length; i++) {
          const b = stack[i];
          drawBlock(b.x, b.y, b.z, b.width, b.depth, BLOCK_HEIGHT, b.hue);
        }

        for (let i = 0; i < fallingPieces.length; i++) {
          const p = fallingPieces[i];
          drawBlock(p.x, p.y, p.z, p.width, p.depth, BLOCK_HEIGHT, p.hue, 0.85);
        }

        if (currentBlock) {
          const c = currentBlock;
          drawBlock(c.x, c.y, c.z, c.width, c.depth, BLOCK_HEIGHT, c.hue);
        }
      }

      function loop() {
        update();
        render();
        requestAnimationFrame(loop);
      }

      // 초기화 및 루프 실행
      resetGame();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
