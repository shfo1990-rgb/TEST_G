<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEON STACK: CYBER TOWER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: radial-gradient(circle at center, #15092c 0%, #05020c 100%);
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 480px;
      max-height: 960px;
      background: #090515;
      box-shadow: 0 0 50px rgba(0, 240, 255, 0.2), 0 0 100px rgba(184, 41, 255, 0.15);
      overflow: hidden;
      cursor: pointer;
    }

    #gameCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 상단 HUD */
    #hud {
      position: absolute;
      top: 35px;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }

    .hud-label {
      font-family: 'Orbitron', monospace;
      font-size: 13px;
      letter-spacing: 4px;
      color: #00f0ff;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.7);
    }

    #score {
      font-family: 'Orbitron', monospace;
      font-size: 64px;
      font-weight: 900;
      line-height: 1;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.9), 0 0 40px rgba(184, 41, 255, 0.6);
      transition: transform 0.1s ease;
    }

    #score.pop {
      transform: scale(1.15);
    }

    #combo-box {
      margin-top: 8px;
      padding: 6px 18px;
      border-radius: 20px;
      background: rgba(255, 0, 128, 0.3);
      border: 1px solid #ff0080;
      box-shadow: 0 0 20px rgba(255, 0, 128, 0.6);
      display: flex;
      gap: 8px;
      align-items: center;
      transition: transform 0.15s ease, background 0.3s;
    }

    #combo-box.fever {
      background: rgba(255, 222, 89, 0.35);
      border-color: #ffde59;
      box-shadow: 0 0 25px rgba(255, 222, 89, 0.8);
    }

    #combo-box.pop {
      transform: scale(1.25);
    }

    #combo-text {
      font-family: 'Orbitron', monospace;
      font-size: 14px;
      font-weight: 900;
      color: #ffde59;
      letter-spacing: 2px;
    }

    #combo-box.fever #combo-text {
      color: #fff;
    }

    #combo-count {
      font-family: 'Orbitron', monospace;
      font-size: 15px;
      font-weight: 900;
      color: #fff;
    }

    /* 스피드 레벨 인디케이터 */
    #speed-indicator {
      margin-top: 6px;
      font-family: 'Orbitron', monospace;
      font-size: 11px;
      letter-spacing: 3px;
      color: #00f0ff;
      opacity: 0.8;
    }

    /* 알림 메시지 토스트 */
    #toast-msg {
      position: absolute;
      top: 150px;
      font-family: 'Orbitron', monospace;
      font-size: 16px;
      font-weight: 900;
      color: #00ffaa;
      text-shadow: 0 0 15px #00ffaa;
      letter-spacing: 3px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
    }

    #toast-msg.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* 오버레이 공통 */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(8, 4, 18, 0.9);
      backdrop-filter: blur(8px);
      z-index: 20;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .overlay.hidden {
      display: none !important;
    }

    .glitch-title {
      font-family: 'Orbitron', monospace;
      font-size: 46px;
      font-weight: 900;
      text-align: center;
      line-height: 1.05;
      letter-spacing: 4px;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(0, 240, 255, 0.8);
    }

    .highlight {
      color: #00f0ff;
      text-shadow: 0 0 30px #00f0ff;
    }

    .subtitle {
      font-family: 'Orbitron', monospace;
      font-size: 12px;
      letter-spacing: 6px;
      color: #b829ff;
      margin-top: 10px;
    }

    .tap-guide {
      margin-top: 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .pulse-circle {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px solid #00f0ff;
      box-shadow: 0 0 20px #00f0ff;
      animation: pulse 1.6s infinite ease-out;
    }

    @keyframes pulse {
      0% { transform: scale(0.8); opacity: 1; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    .tap-guide span {
      font-size: 16px;
      letter-spacing: 3px;
      color: #00f0ff;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.8);
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* 하단 버튼 툴바 */
    .bottom-toolbar {
      position: absolute;
      bottom: 30px;
      display: flex;
      gap: 15px;
      pointer-events: auto;
    }

    .icon-btn {
      padding: 10px 22px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(0, 240, 255, 0.4);
      color: #00f0ff;
      font-family: 'Orbitron', monospace;
      font-size: 13px;
      letter-spacing: 2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s, box-shadow 0.2s;
    }

    .icon-btn:hover {
      background: rgba(0, 240, 255, 0.2);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
    }

    /* 게임 오버 화면 */
    .game-over-title {
      font-family: 'Orbitron', monospace;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 4px;
      color: #ff0055;
      text-shadow: 0 0 25px rgba(255, 0, 85, 0.8);
      margin-bottom: 20px;
    }

    .result-box {
      width: 82%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 16px 24px;
      margin-bottom: 15px;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      font-size: 17px;
      color: #ccc;
    }

    .result-row:not(:last-child) {
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .result-val {
      font-family: 'Orbitron', monospace;
      font-size: 24px;
      font-weight: 900;
      color: #fff;
    }

    .glow-btn {
      width: 82%;
      padding: 15px 20px;
      margin-top: 10px;
      border-radius: 30px;
      border: none;
      font-family: 'Orbitron', monospace;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      cursor: pointer;
      background: linear-gradient(135deg, #00f0ff, #7000ff);
      color: #fff;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.5);
      pointer-events: auto;
      transition: transform 0.1s;
    }

    .glow-btn:active {
      transform: scale(0.96);
    }

    .glow-btn.reward {
      background: linear-gradient(135deg, #ff0080, #ffde59);
      box-shadow: 0 0 30px rgba(255, 0, 128, 0.6);
      animation: rewardGlow 2s infinite ease-in-out;
    }

    @keyframes rewardGlow {
      0%, 100% { box-shadow: 0 0 25px rgba(255, 0, 128, 0.6); }
      50% { box-shadow: 0 0 45px rgba(255, 222, 89, 0.9); }
    }

    /* 랭킹 모달 */
    #leaderboard-modal {
      z-index: 30;
    }

    .modal-card {
      width: 86%;
      max-height: 80vh;
      background: rgba(14, 8, 28, 0.96);
      border: 1px solid #00f0ff;
      box-shadow: 0 0 40px rgba(0, 240, 255, 0.35);
      border-radius: 16px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: auto;
    }

    .modal-title {
      font-family: 'Orbitron', monospace;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #00f0ff;
      text-shadow: 0 0 15px #00f0ff;
      margin-bottom: 18px;
    }

    .rank-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
      overflow-y: auto;
    }

    .rank-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 15px;
    }

    .rank-item.top-1 {
      background: rgba(255, 222, 89, 0.15);
      border-color: #ffde59;
      color: #ffde59;
    }

    .rank-item.my-rank {
      background: rgba(0, 240, 255, 0.2);
      border-color: #00f0ff;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
    }

    .rank-num {
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      width: 32px;
    }

    .rank-name {
      flex: 1;
      font-family: 'Orbitron', monospace;
      letter-spacing: 1px;
      text-align: left;
      padding-left: 5px;
    }

    .rank-score {
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      font-size: 17px;
    }

    .close-modal-btn {
      width: 100%;
      padding: 12px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-family: 'Orbitron', monospace;
      font-size: 14px;
      letter-spacing: 2px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- 상단 HUD -->
    <div id="hud">
      <div id="score-box">
        <span class="hud-label">SCORE</span>
        <span id="score">0</span>
      </div>
      <div id="combo-box" style="display: none;">
        <span id="combo-text">PERFECT!</span>
        <span id="combo-count">x1</span>
      </div>
      <div id="speed-indicator">SPEED: 1.0x</div>
      <div id="toast-msg">SIZE EXPANDED!</div>
    </div>

    <!-- 시작 화면 -->
    <div id="start-screen" class="overlay">
      <h1 class="glitch-title">NEON<br><span class="highlight">STACK</span></h1>
      <p class="subtitle">CYBER TOWER 2077</p>
      <div class="tap-guide">
        <div class="pulse-circle"></div>
        <span>TAP TO START</span>
      </div>
      <div class="bottom-toolbar">
        <button id="open-rank-btn" class="icon-btn">
          <span>🏆 LEADERBOARD</span>
        </button>
      </div>
    </div>

    <!-- 게임 오버 화면 -->
    <div id="game-over-screen" class="overlay hidden">
      <h2 class="game-over-title">SYSTEM COLLAPSE</h2>
      <div class="result-box">
        <div class="result-row">
          <span>SCORE</span>
          <span id="final-score" class="result-val">0</span>
        </div>
        <div class="result-row">
          <span>BEST RECORD</span>
          <span id="final-best" class="result-val highlight">0</span>
        </div>
        <div class="result-row">
          <span>GLOBAL RANK</span>
          <span id="final-rank" class="result-val" style="color: #ffde59;">#?</span>
        </div>
      </div>
      <button id="reward-ad-btn" class="glow-btn reward">
        ⚡ REVIVE (RESTORE SIZE)
      </button>
      <button id="restart-btn" class="glow-btn">
        PLAY AGAIN
      </button>
      <button id="game-over-rank-btn" class="glow-btn" style="background: rgba(255,255,255,0.08); border: 1px solid rgba(0,240,255,0.4); box-shadow: none;">
        🏆 VIEW LEADERBOARD
      </button>
    </div>

    <!-- 랭킹 모달 -->
    <div id="leaderboard-modal" class="overlay hidden">
      <div class="modal-card">
        <h3 class="modal-title">🏆 GLOBAL LEADERBOARD</h3>
        <div id="rank-list-box" class="rank-list">
        </div>
        <button id="close-rank-btn" class="close-modal-btn">CLOSE</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const STATE = { READY: 0, PLAYING: 1, GAMEOVER: 2 };
      let state = STATE.READY;

      const container = document.getElementById('game-container');
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const comboBox = document.getElementById('combo-box');
      const comboTextEl = document.getElementById('combo-text');
      const comboCountEl = document.getElementById('combo-count');
      const speedIndicatorEl = document.getElementById('speed-indicator');
      const toastEl = document.getElementById('toast-msg');
      const startScreen = document.getElementById('start-screen');
      const gameOverScreen = document.getElementById('game-over-screen');
      const finalScoreEl = document.getElementById('final-score');
      const finalBestEl = document.getElementById('final-best');
      const finalRankEl = document.getElementById('final-rank');
      const restartBtn = document.getElementById('restart-btn');
      const rewardAdBtn = document.getElementById('reward-ad-btn');
      const leaderboardModal = document.getElementById('leaderboard-modal');
      const rankListBox = document.getElementById('rank-list-box');
      const openRankBtn = document.getElementById('open-rank-btn');
      const gameOverRankBtn = document.getElementById('game-over-rank-btn');
      const closeRankBtn = document.getElementById('close-rank-btn');

      const BLOCK_HEIGHT = 28;
      const INITIAL_SIZE = 220;
      const PERFECT_TOLERANCE = 6;
      const RECOVER_COMBO = 4;

      let score = 0;
      let bestScore = 0;
      try { bestScore = parseInt(localStorage.getItem('neon_best') || '0', 10); } catch(e) {}

      let combo = 0;
      let colorHue = 190;
      let stack = [];
      let fallingPieces = [];
      let particles = [];
      let currentBlock = null;
      let cameraY = 0;
      let targetCameraY = 0;
      let viewWidth = 360;
      let viewHeight = 640;

      let shakeIntensity = 0;
      let shakeOffsetX = 0;
      let shakeOffsetY = 0;

      const DEFAULT_RIVAL_RANKS = [
        { name: 'CYBER_NEXUS', score: 88 },
        { name: 'NEON_GHOST', score: 65 },
        { name: 'SYNTH_WAVE', score: 47 },
        { name: 'BLADE_RUNNER', score: 32 },
        { name: 'PILOT_01', score: 18 }
      ];

      function getLeaderboard() {
        let board = [];
        try {
          const stored = localStorage.getItem('neon_ranks');
          if (stored) board = JSON.parse(stored);
        } catch(e) {}

        if (!board || board.length === 0) {
          board = [...DEFAULT_RIVAL_RANKS];
        }

        const myExisting = board.find(r => r.isMe);
        if (myExisting) {
          myExisting.score = Math.max(myExisting.score, bestScore);
        } else if (bestScore > 0) {
          board.push({ name: 'YOU (PILOT)', score: bestScore, isMe: true });
        }

        board.sort((a, b) => b.score - a.score);
        return board.slice(0, 8);
      }

      function updateLeaderboardUI() {
        const board = getLeaderboard();
        rankListBox.innerHTML = '';

        board.forEach((item, idx) => {
          const row = document.createElement('div');
          row.className = 'rank-item' + (idx === 0 ? ' top-1' : '') + (item.isMe ? ' my-rank' : '');
          row.innerHTML = `
            <span class="rank-num">#${idx + 1}</span>
            <span class="rank-name">${item.name}</span>
            <span class="rank-score">${item.score}</span>
          `;
          rankListBox.appendChild(row);
        });
      }

      function calculatePlayerRank(currentScore) {
        const board = getLeaderboard();
        let rank = board.length + 1;
        for (let i = 0; i < board.length; i++) {
          if (currentScore >= board[i].score) {
            rank = i + 1;
            break;
          }
        }
        return rank;
      }

      let audioCtx = null;
      const noteFreqs = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];

      function playSound(type, comboCount = 0) {
        try {
          if (!audioCtx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (AC) audioCtx = new AC();
          }
          if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
          if (!audioCtx) return;

          const now = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          if (type === 'hit') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(320, now);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.15);
          } else if (type === 'perfect') {
            osc.type = 'triangle';
            const noteIdx = Math.min(comboCount, noteFreqs.length - 1);
            const freq = noteFreqs[noteIdx];
            osc.frequency.setValueAtTime(freq, now);
            osc.frequency.exponentialRampToValueAtTime(freq * 1.5, now + 0.2);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.35);
          } else if (type === 'recover') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.4);
            gain.gain.setValueAtTime(0.35, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.45);
          } else if (type === 'gameover') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.exponentialRampToValueAtTime(45, now + 0.5);
            gain.gain.setValueAtTime(0.35, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.5);
          }
        } catch(e) {}
      }

      function triggerHaptic(duration = 20) {
        if ('vibrate' in navigator) {
          try { navigator.vibrate(duration); } catch(e) {}
        }
      }

      function resize() {
        const rect = container.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        viewWidth = rect.width || 360;
        viewHeight = rect.height || 640;
        canvas.width = viewWidth * dpr;
        canvas.height = viewHeight * dpr;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(dpr, dpr);
      }
      window.addEventListener('resize', resize);
      resize();

      function project(x, y, z) {
        const originX = viewWidth / 2 + shakeOffsetX;
        const originY = viewHeight * 0.68 + cameraY + shakeOffsetY;
        const isoX = originX + (x - z) * 0.866;
        const isoY = originY + (x + z) * 0.5 - y;
        return { x: isoX, y: isoY };
      }

      function createParticles(x, y, z, width, depth, hue, count = 35) {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 2.5 + Math.random() * 5.5;
          particles.push({
            x: x + (Math.random() - 0.5) * width,
            y: y + BLOCK_HEIGHT,
            z: z + (Math.random() - 0.5) * depth,
            vx: Math.cos(angle) * speed,
            vy: 3.0 + Math.random() * 5.0,
            vz: Math.sin(angle) * speed,
            size: 2.5 + Math.random() * 3.5,
            hue: hue,
            alpha: 1.0,
            life: 0.95
          });
        }
      }

      function drawBlock(x, y, z, width, depth, height, hue, alpha = 1.0, isGlow = false) {
        const hw = width / 2;
        const hd = depth / 2;

        const p0 = project(x - hw, y + height, z - hd);
        const p1 = project(x + hw, y + height, z - hd);
        const p2 = project(x + hw, y + height, z + hd);
        const p3 = project(x - hw, y + height, z + hd);

        const b1 = project(x + hw, y, z - hd);
        const b2 = project(x + hw, y, z + hd);
        const b3 = project(x - hw, y, z + hd);

        ctx.fillStyle = 'hsla(' + hue + ', 85%, 35%, ' + alpha + ')';
        ctx.beginPath();
        ctx.moveTo(p3.x, p3.y); ctx.lineTo(p2.x, p2.y); ctx.lineTo(b2.x, b2.y); ctx.lineTo(b3.x, b3.y);
        ctx.closePath(); ctx.fill();

        ctx.fillStyle = 'hsla(' + hue + ', 85%, 22%, ' + alpha + ')';
        ctx.beginPath();
        ctx.moveTo(p2.x, p2.y); ctx.lineTo(p1.x, p1.y); ctx.lineTo(b1.x, b1.y); ctx.lineTo(b2.x, b2.y);
        ctx.closePath(); ctx.fill();

        ctx.fillStyle = 'hsla(' + hue + ', 95%, ' + (isGlow ? '72%' : '58%') + ', ' + alpha + ')';
        ctx.beginPath();
        ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.lineTo(b2.x, b2.y); ctx.lineTo(p3.x, p3.y);
        ctx.closePath(); ctx.fill();

        ctx.strokeStyle = 'hsla(' + hue + ', 100%, 85%, ' + alpha + ')';
        ctx.lineWidth = isGlow ? 2.5 : 1.5;
        ctx.stroke();
      }

      function calculateSpeed(currentScore, comboCount) {
        const baseSpeed = 3.2;
        const accel = Math.min(currentScore * 0.12, 5.8);
        const feverBonus = (comboCount >= 3) ? 0.5 : 0;
        return baseSpeed + accel + feverBonus;
      }

      function spawnBlock() {
        const top = stack[stack.length - 1];
        const isEven = stack.length % 2 === 0;
        colorHue = (colorHue + 11) % 360;

        const axis = isEven ? 'z' : 'x';
        const speed = calculateSpeed(score, combo);

        const speedMultiplier = (speed / 3.2).toFixed(1);
        speedIndicatorEl.innerText = 'SPEED: ' + speedMultiplier + 'x';

        currentBlock = {
          x: top.x,
          z: top.z,
          width: top.width,
          depth: top.depth,
          y: stack.length * BLOCK_HEIGHT,
          axis: axis,
          dir: 1,
          speed: speed,
          hue: colorHue
        };

        if (axis === 'x') currentBlock.x = -270;
        else currentBlock.z = -270;

        if (stack.length > 5) {
          targetCameraY = (stack.length - 5) * BLOCK_HEIGHT;
        }
      }

      function resetGame() {
        score = 0;
        combo = 0;
        colorHue = Math.floor(Math.random() * 360);
        stack = [];
        fallingPieces = [];
        particles = [];
        cameraY = 0;
        targetCameraY = 0;
        shakeIntensity = 0;
        scoreEl.innerText = '0';
        speedIndicatorEl.innerText = 'SPEED: 1.0x';
        comboBox.style.display = 'none';

        stack.push({
          x: 0,
          z: 0,
          width: INITIAL_SIZE,
          depth: INITIAL_SIZE,
          y: 0,
          hue: colorHue
        });

        spawnBlock();
      }

      function triggerGameOver() {
        state = STATE.GAMEOVER;
        playSound('gameover');
        triggerHaptic(80);
        shakeIntensity = 18;

        if (score > bestScore) {
          bestScore = score;
          try { localStorage.setItem('neon_best', bestScore.toString()); } catch(e) {}
        }

        const myRank = calculatePlayerRank(score);
        finalScoreEl.innerText = score;
        finalBestEl.innerText = bestScore;
        finalRankEl.innerText = '#' + myRank;

        const board = getLeaderboard();
        try { localStorage.setItem('neon_ranks', JSON.stringify(board)); } catch(e) {}

        setTimeout(function() {
          gameOverScreen.classList.remove('hidden');
        }, 500);
      }

      function showToast(msg) {
        toastEl.innerText = msg;
        toastEl.classList.add('show');
        setTimeout(function() { toastEl.classList.remove('show'); }, 1200);
      }

      function handleAction() {
        if (!leaderboardModal.classList.contains('hidden')) return;

        if (state === STATE.READY) {
          state = STATE.PLAYING;
          startScreen.classList.add('hidden');
          playSound('hit');
          triggerHaptic(20);
          return;
        }

        if (state === STATE.PLAYING && currentBlock) {
          const prev = stack[stack.length - 1];
          const cur = currentBlock;
          const axis = cur.axis;
          const delta = cur[axis] - prev[axis];
          const absDelta = Math.abs(delta);
          const sizeProp = axis === 'x' ? 'width' : 'depth';
          const origSize = prev[sizeProp];

          if (absDelta <= PERFECT_TOLERANCE) {
            cur[axis] = prev[axis];
            combo++;
            shakeIntensity = 5;
            triggerHaptic(30);

            if (combo % RECOVER_COMBO === 0 && cur[sizeProp] < INITIAL_SIZE) {
              const expand = Math.min(25, INITIAL_SIZE - cur[sizeProp]);
              cur[sizeProp] += expand;
              showToast('SIZE RECOVERED! +' + expand + 'px');
              playSound('recover');
            } else {
              playSound('perfect', combo);
            }

            createParticles(cur.x, cur.y, cur.z, cur.width, cur.depth, cur.hue, 40);

            comboCountEl.innerText = 'x' + combo;
            if (combo >= 3) {
              comboTextEl.innerText = 'FEVER!';
              comboBox.classList.add('fever');
            } else {
              comboTextEl.innerText = 'PERFECT!';
              comboBox.classList.remove('fever');
            }
            comboBox.style.display = 'flex';
            comboBox.classList.remove('pop');
            void comboBox.offsetWidth;
            comboBox.classList.add('pop');

            const addScore = (combo >= 3) ? 2 : 1;
            score += addScore;
            scoreEl.innerText = score;
            scoreEl.classList.add('pop');
            setTimeout(function() { scoreEl.classList.remove('pop'); }, 150);

            stack.push(cur);
            spawnBlock();
            return;
          }

          if (absDelta >= origSize) {
            fallingPieces.push({
              x: cur.x, z: cur.z, y: cur.y,
              width: cur.width, depth: cur.depth,
              hue: cur.hue, vy: 0
            });
            currentBlock = null;
            triggerGameOver();
            return;
          }

          combo = 0;
          comboBox.style.display = 'none';
          comboBox.classList.remove('fever');
          playSound('hit');
          triggerHaptic(20);
          shakeIntensity = 7;

          const newSize = origSize - absDelta;
          const fallSize = absDelta;

          cur[sizeProp] = newSize;
          if (delta > 0) cur[axis] = prev[axis] + absDelta / 2;
          else cur[axis] = prev[axis] - absDelta / 2;

          stack.push(cur);
          score++;
          scoreEl.innerText = score;

          const fp = {
            x: cur.x, z: cur.z, y: cur.y,
            width: cur.width, depth: cur.depth,
            hue: cur.hue, vy: 0
          };
          fp[sizeProp] = fallSize;
          if (delta > 0) fp[axis] = cur[axis] + newSize / 2 + fallSize / 2;
          else fp[axis] = cur[axis] - newSize / 2 - fallSize / 2;

          fallingPieces.push(fp);
          spawnBlock();
        }
      }

      window.addEventListener('mousedown', function(e) {
        if (e.target && (e.target.tagName === 'BUTTON' || e.target.closest('button'))) return;
        handleAction();
      });

      window.addEventListener('touchstart', function(e) {
        if (e.target && (e.target.tagName === 'BUTTON' || e.target.closest('button'))) return;
        e.preventDefault();
        handleAction();
      }, { passive: false });

      restartBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        resetGame();
        state = STATE.PLAYING;
        gameOverScreen.classList.add('hidden');
      });

      rewardAdBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        rewardAdBtn.innerText = 'WATCHING AD... (3s)';
        rewardAdBtn.disabled = true;
        setTimeout(function() {
          rewardAdBtn.innerText = '⚡ REVIVE (RESTORE SIZE)';
          rewardAdBtn.disabled = false;
          gameOverScreen.classList.add('hidden');

          const top = stack[stack.length - 1];
          top.width = INITIAL_SIZE;
          top.depth = INITIAL_SIZE;
          top.x = 0;
          top.z = 0;
          state = STATE.PLAYING;
          spawnBlock();
        }, 3000);
      });

      openRankBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        updateLeaderboardUI();
        leaderboardModal.classList.remove('hidden');
      });

      gameOverRankBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        updateLeaderboardUI();
        leaderboardModal.classList.remove('hidden');
      });

      closeRankBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        leaderboardModal.classList.add('hidden');
      });

      function update() {
        if (state === STATE.PLAYING && currentBlock) {
          const b = currentBlock;
          b[b.axis] += b.speed * b.dir;
          const LIMIT = 270;
          if (b[b.axis] > LIMIT) { b[b.axis] = LIMIT; b.dir = -1; }
          else if (b[b.axis] < -LIMIT) { b[b.axis] = -LIMIT; b.dir = 1; }
        }

        for (let i = fallingPieces.length - 1; i >= 0; i--) {
          const p = fallingPieces[i];
          p.vy += 0.85;
          p.y -= p.vy;
          if (p.y < cameraY - 450) {
            fallingPieces.splice(i, 1);
          }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          const pt = particles[i];
          pt.x += pt.vx;
          pt.y += pt.vy;
          pt.z += pt.vz;
          pt.vy -= 0.35;
          pt.alpha *= pt.life;
          if (pt.alpha < 0.05) {
            particles.splice(i, 1);
          }
        }

        cameraY += (targetCameraY - cameraY) * 0.1;

        if (shakeIntensity > 0) {
          shakeOffsetX = (Math.random() - 0.5) * shakeIntensity;
          shakeOffsetY = (Math.random() - 0.5) * shakeIntensity;
          shakeIntensity *= 0.85;
          if (shakeIntensity < 0.3) {
            shakeIntensity = 0;
            shakeOffsetX = 0;
            shakeOffsetY = 0;
          }
        }
      }

      function render() {
        ctx.clearRect(0, 0, viewWidth, viewHeight);

        for (let i = 0; i < stack.length; i++) {
          const b = stack[i];
          const isTop = (i === stack.length - 1);
          drawBlock(b.x, b.y, b.z, b.width, b.depth, BLOCK_HEIGHT, b.hue, 1.0, isTop && combo >= 3);
        }

        for (let i = 0; i < fallingPieces.length; i++) {
          const p = fallingPieces[i];
          drawBlock(p.x, p.y, p.z, p.width, p.depth, BLOCK_HEIGHT, p.hue, 0.85);
        }

        for (let i = 0; i < particles.length; i++) {
          const pt = particles[i];
          const scr = project(pt.x, pt.y, pt.z);
          ctx.fillStyle = 'hsla(' + pt.hue + ', 100%, 75%, ' + pt.alpha + ')';
          ctx.beginPath();
          ctx.arc(scr.x, scr.y, pt.size, 0, Math.PI * 2);
          ctx.fill();
        }

        if (currentBlock) {
          const c = currentBlock;
          drawBlock(c.x, c.y, c.z, c.width, c.depth, BLOCK_HEIGHT, c.hue, 1.0, combo >= 3);
        }
      }

      function loop() {
        update();
        render();
        requestAnimationFrame(loop);
      }

      resetGame();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
